# RocketMQ 5.3.2 Broker 增强配置
# 解决系统主题创建失败和网络连接问题

# 基础配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 72
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 网络配置 - 解决 Docker 网络问题
brokerIP1 = localhost
brokerIP2 = localhost
listenPort = 10911
namesrvAddr = localhost:9876

# 系统主题配置 - 解决 DefaultHeartBeatSyncerTopic 创建失败
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
clusterTopicEnable = true
brokerTopicEnable = true

# 默认主题配置
defaultTopicQueueNums = 8
useReentrantLockWhenPutMessage = true

# 性能优化配置
sendMessageThreadPoolNums = 16
pullMessageThreadPoolNums = 32
queryMessageThreadPoolNums = 8
adminBrokerThreadPoolNums = 16
clientManagerThreadPoolNums = 32

# 存储配置
storePathRootDir = /opt/rocketmq-5.3.2/store
storePathCommitLog = /opt/rocketmq-5.3.2/store/commitlog
storePathConsumeQueue = /opt/rocketmq-5.3.2/store/consumequeue
storePathIndex = /opt/rocketmq-5.3.2/store/index
storeCheckpoint = /opt/rocketmq-5.3.2/store/checkpoint
abortFile = /opt/rocketmq-5.3.2/store/abort

# 消息存储配置
maxMessageSize = 65536
flushCommitLogLeastPages = 4
flushConsumeQueueLeastPages = 2
flushCommitLogThoroughInterval = 10000
flushConsumeQueueThoroughInterval = 60000

# 高级配置
compressedRegister = true
forceRegister = true
registerBrokerTimeoutMills = 6000
fetchNameSrvAddrByAddressServer = true

# 系统主题权限配置
enablePropertyFilter = false
msgTraceTopicName = RMQ_SYS_TRACE_TOPIC
traceTopicEnable = true

# Proxy 相关配置
enableSlaveActingMaster = false
enableRemoteEscape = false
skipPreOnline = false